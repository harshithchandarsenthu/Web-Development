<html>
<head>
    <title>Stacks and Arrays</title>
</head>
<body>
    <h2>JavaScript Functions</h2>
    <p id="resultingvalue"></p>
    <p id="join"></p>
    <p id="p"></p>
    <p id="p2"></p>
    <button onclick="average(963, 369)">Click here for average</button>
    <script>
        var number = ["Array0", "Array1", "Array2", "Array3"];
        document.getElementById("join").innerHTML = number.join(" , ");
        document.getElementById("p").innerHTML = number.pop();
        document.getElementById("p2").innerHTML = number;
        function add(a, b) {return a + b;}
        function average(a, b) {var ea = add(a, b) / 2;document.getElementById("resultingvalue").innerHTML = ea;}
    </script>
</body>
</html>
