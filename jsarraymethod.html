<html>
    <head>
        <title>
            Arrays and Methods
        </title>
    </head>
    <body>
    <h2>JavaScript Arrays</h2>
    <p id="join"></p>
    <p id="p"></p>
    <p id="p2"></p>
    <script>
      var array = ["Number0", "Number1", "Number2", "Number3"];
      document.getElementById("join").innerHTML = array.join(" , ");
      document.getElementById("p").innerHTML = array.pop();
      document.getElementById("p2").innerHTML = array;
    </script>
    </body>
    </html>
