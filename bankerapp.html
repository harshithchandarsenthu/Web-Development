<!DOCTYPE html>
<html>
    <head>
        <title>Calculator</title>
    </head>

    <body>

        <h1>Calculator</h1>

        <!-- Calculator -->
        <div id="calculator">

            <input type="text" id="display" value="0" readonly>

            <div id="keyboard">

                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button>/</button>

                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button>*</button>

                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>-</button>

                <button>0</button>
                <button>.</button>
                <button>C</button>
                <button>+</button>

                <button>=</button>

            </div>

        </div>


        <!-- Credit and Debit -->
        <div id="transactions">

            <h2>Transactions</h2>

            <button>Credit</button>
            <button>Debit</button>

        </div>
        <div id="balance">

            <h2>Balance</h2>

            <p>Remaining Balance: <span>0</span></p>

        </div>


    </body>
</html>
