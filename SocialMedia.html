<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"/>
        <link rel="stylesheet" href="style.css"/>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"/>
        <link href="https://fonts.googleapis.com/css2?family=Barlow+TT:wght@400;500;600;700&display=swap" rel="stylesheet"/>
        <title>Portfolio</title>

    <body>
        <div id="social-media" class="container-fluid">
            <div class="container text-white py-5">
                <h4 class="text-warning">Social Media</h4>
                <h1 class="m-heading">Let's be friends</h1>
                <div class="row pt-5">
                    <div class="col-3 media_link btn">
                        <div class="row">
                            <div class="col-8 text-warning">
                                <h3>LinkedIn</h3>
                          </div>
                            <div class="col-4">
                                <i class="fab fa-linkedin fa-2x"></i>
                            </div>
                        </div>
                    </div>
                    <div class="col-3 media_link btn">
                        <div class="row">
                            <div class="col-8 text-warning">
                                <h3>Youtube</h3>
                            </div>
                            <div class="col-4">
                                <i class="fab fa-youtube fa-2x"></i>
                            </div>
                        </div>
                    </div>
                    <div class="col-3 media_link bg-warning btn">
                        <div class="row">
                            <div class="col-8">
                                <h3 class="text-dark">Email</h3>
                            </div>
                            <div class="col-4">
                                <i class="fas fa-envelope fa-2x text-dark"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
