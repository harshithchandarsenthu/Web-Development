<html>
    <head>
        <title>Lucky Number</title>
        <style>
            .form {text-align: center; padding: 5px; border: 2px solid gray; border-radius: 9%; font-family:Arial, Helvetica, sans-serif; width: fit-content; height: fit-content;}
            body {background: lightgray; justify-content: center;}
            h1 {text-align:center; font-weight: bolder;}
            button {border: 2px outset grey; padding: 2px;}
        </style>
    </head>
    <body>
        <h1>Guess a number, win a prize!</h1>
        <br>
        <div class="form">
            <form>
                <p id="msg-name"></p>
                <label>Name:</label>
                <input type="text" id="name"> <br> <br>
                <p id="msg-number"></p>
                <label>Guess:</label>
                <input type="number" id="guess" min="1" max="5" required placeholder="Guess a number from 1-5"> <br>
                <button onclick="checkForm()"><b>Submit</b></button>
                <p id="timer"></p>
                <p id="result"></p>
            </form>
        </div>
        <script>
            var seconds = 0;
            setInterval(function() {seconds = seconds + 1; document.getElementById("timer").textContent = "You have stayed in the page for" + seconds}, 100000);
            function checkForm() {
            var ok = true;
            var name = document.getElementById("name").value;
            if (name == "") {ok = false; document.getElementById("msg-name").textContent = "Enter your name:";}
            else {document.getElementById("msg-name").textContent = "Nice name..."}
            var name  = document.getElementById("name").value;
            var guess = document.getElementById("guess").value;
            if (ok == true) {var lucky = Math.floor(Math.random() * 5) + 1; if (lucky == guess){document.getElementById("result").textContent = "You guessed the number right!"}}
            else {document.getElementById("result").textContent = "Try Again..."}}
        </script>
    </body>
</html>
