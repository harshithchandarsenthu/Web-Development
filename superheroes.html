    <body> 
        <h1>Our Superheroes</h1>

                this.name = name; 
                this.power = power;}}

                let hero3 = new Hero("Iron Man", "Uses a powerful high-tech suit."); 
                let hero4 = new Hero("Thor", "Controls lightning and uses Mjolnir."); 
                let hero5 = new Hero("Hulk", "Has incredible strength."); 
                
                function showHeroes() { 
                document.getElementById("heroes").innerHTML = 
                "<div class='hero1'>" + 
                "<h2>" + hero1.name + "</h2>" + 
                "<p>" + hero1.power + "</p>" + 
                "</div>" +

                "<h2>" + hero2.name + "</h2>" + 
                "<p>" + hero2.power + "</p>" + 
                "</div>" +

                "</div>" +

                "</div>" +

                "</div>";} 
        </script>
