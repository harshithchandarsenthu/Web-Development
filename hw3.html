<html>

    <body>
        <h2>Javascript String Loops</h2>
        <p> Loopy </p>
        <p id="demo"></p>
        <p id="demo2"></p>
        <script>
            var str = "dAtabASe"
            document.write(str.toUpperCase());
            document.write("<br>");
            document.write(str.toLowerCase());
            document.write("<br>");
            document.write(str.startsWith("d"))
            document.write("<br>"); 
            var str1 = "Coding with JS";
            var patt = new RegExp("dAtabASe");
            var res = patt.test(str);
            document.write(res)
            var fruits = ["Apple", "Mango", "Grapes", "Watermelon", "Jack Fruit", "Banana"];
            var text = "";
            var i;
            for (i = 0; i < fruits.length; i++) {text += fruits[i] + "<br>";}
            document.getElementById("demo").innerHTML = text;
            var day;
            switch (new Date().getDay())
            {case 0: day = "Sunday";
            break;
            case 1: day = "Monday";
            break;
            case 2: day = "Tuesday";
            break;
            case 3: day = "Wednesday";
            break;
            case 4: day = "Thursday";
            break;
            case 5: day = "Friday";
            break;
            case 6: day = "Saturday";}
                     document.getElementById("demo2").innerHTML = "Today is " + day;
        </script>
    </body>
